services:
  nginx:
    image: "${NGINX_IMAGE:?Specify the release images.env}"
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - php
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
  php:
    image: "${PHP_IMAGE:?Specify the release images.env}"
    pull_policy: never
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${SITE_DIR:?Set SITE_DIR to the existing site directory}"
        target: /var/www/html
        bind:
          create_host_path: false
